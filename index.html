<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="PractiCore AI competition prototype. Learn to use AI through your own everyday work tasks.">
<title>PractiCore AI — Your work, enhanced</title>
<style>
:root{
  --ink:#172c2a;
  --muted:#6b7773;
  --green:#126b56;
  --mint:#dcf2e7;
  --lime:#d6ef93;
  --paper:#f5f7f3;
  --line:#e0e6df;
  --white:#fff;
  --radius:18px;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit}
button,a,input,select,textarea{outline-color:var(--green)}
button{cursor:pointer;border:0}
button:disabled{opacity:.45;cursor:not-allowed}
a{color:var(--green)}
svg{
  width:20px;height:20px;
  stroke:currentColor;stroke-width:1.65;
  fill:none;stroke-linecap:round;stroke-linejoin:round;
  flex-shrink:0;
}
.shell{display:flex;min-height:100vh}
.sidebar{
  width:236px;position:fixed;inset:0 auto 0 0;
  background:#fcfdfb;border-right:1px solid var(--line);
  padding:32px 20px 20px;display:flex;flex-direction:column;z-index:20;
}
.sidebar-backdrop{
  display:none;position:fixed;inset:0;background:#15352c66;z-index:15;
}
.sidebar-backdrop.open{display:block}
.brand{
  font-size:24px;letter-spacing:-1.2px;font-weight:750;
  display:flex;gap:10px;align-items:center;padding:0 10px;
  background:none;color:var(--ink);text-align:left;
}
.brand-mark{
  background:var(--green);color:var(--lime);
  width:34px;height:38px;border-radius:11px 11px 11px 3px;
  display:grid;place-items:center;font-size:25px;
}
.brand small{font-size:11px;margin:8px 0 0 -4px;color:var(--green)}
.workspace-label{
  font-size:10px;letter-spacing:1.9px;color:#8a948e;
  font-weight:700;margin:42px 14px 15px;
}
.nav{display:flex;flex-direction:column;gap:7px}
.nav button{
  display:flex;align-items:center;gap:12px;text-align:left;
  padding:13px 15px;border-radius:10px;color:#66756c;
  background:none;font-size:14px;font-weight:550;transition:background .15s,color .15s;
}
.nav button.active{background:#e5f0e8;color:#125d49}
.nav button:hover{background:#eef3ed}
.side-bottom{margin-top:auto;padding-top:35px}
.demo-help{
  background:#edf4e7;border:1px solid #e3eadb;
  padding:16px;border-radius:13px;font-size:12px;color:#5c6b5e;
}
.demo-help strong{display:block;color:#354e35;margin-bottom:4px}
.text-button{
  background:none;padding:0;color:var(--green);
  font-size:12px;text-decoration:underline;text-underline-offset:4px;
}
.profile{
  margin-top:24px;padding:16px 10px 0;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:11px;font-size:12px;
}
.avatar{
  width:34px;height:34px;border-radius:50%;background:#e9e5dc;
  display:grid;place-items:center;font-weight:650;
}
.profile strong{display:block;font-size:12px}
.profile span{color:var(--muted);font-size:11px}
.main{margin-left:236px;width:calc(100% - 236px)}
.topbar{
  height:85px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 44px;background:#fcfdfb;
}
.crumb{font-size:12px;color:#8a948e}
.crumb b{font-weight:500;color:#384b40}
.top-right{display:flex;align-items:center;gap:20px}
.demo-tag{
  font-size:10px;letter-spacing:1.3px;color:#65715c;
  border:1px solid #dbe3d4;padding:5px 10px;border-radius:5px;
}
.quiet-btn{
  display:flex;gap:7px;align-items:center;background:none;
  color:#53654f;font-size:12px;padding:6px 10px;border-radius:8px;
}
.quiet-btn:hover{background:#eef3ed}
.quiet-btn svg{width:16px;height:16px}
.content{max-width:1350px;margin:auto;padding:40px 44px 55px}
.eyebrow{
  font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--green);font-weight:750;margin:0 0 10px;
}
h1,h2,h3,p{margin:0}
h1{font-size:35px;letter-spacing:-1.5px;line-height:1.2;font-weight:650}
h2{font-size:20px;letter-spacing:-.6px;font-weight:650}
h3{font-size:15px;font-weight:650}
.subtitle{color:var(--muted);margin-top:11px;font-size:14px;max-width:700px}
.heading-row{
  display:flex;justify-content:space-between;align-items:center;
  gap:15px;margin-bottom:29px;
}
.path-steps{
  display:flex;gap:0;border-bottom:1px solid var(--line);margin:30px 0;
}
.path-step{
  padding:0 22px 16px 0;margin-right:27px;color:#8b968c;
  font-size:12px;display:flex;align-items:center;gap:8px;
  background:none;
}
.path-step:hover{color:var(--ink)}
.path-step span{
  display:grid;place-items:center;width:22px;height:22px;
  border:1px solid #d5ddd3;border-radius:50%;font-size:10px;
}
.path-step.active{
  color:var(--green);border-bottom:2px solid var(--green);margin-bottom:-1px;
}
.path-step.active span{
  background:var(--green);border-color:var(--green);color:white;
}
.grid{
  display:grid;grid-template-columns:minmax(0,1.75fr) minmax(265px,1fr);gap:25px;
}
.panel{
  background:var(--white);border:1px solid var(--line);
  border-radius:var(--radius);padding:27px;
}
.panel-head{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;
}
.small-label{font-size:11px;color:var(--muted)}
.section-title{font-size:13px;font-weight:650;display:block;margin:24px 0 12px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label.field{
  display:flex;flex-direction:column;gap:7px;
  font-size:11px;font-weight:600;color:#647068;
}
input,select,textarea{
  color:var(--ink);border:1px solid #dce3db;border-radius:9px;
  background:#fcfdfb;padding:11px 12px;font-size:12px;width:100%;
}
input[type="range"]{padding:0;accent-color:var(--green);cursor:pointer}
select{padding-right:24px}
textarea{resize:vertical;min-height:90px;line-height:1.65}
.task-row{
  display:flex;gap:12px;align-items:center;
  padding:15px 0;border-bottom:1px solid #eef1eb;cursor:pointer;
}
.task-row:last-child{border:0}
.task-row input{width:17px;height:17px;accent-color:var(--green);flex-shrink:0}
.task-copy{flex:1;font-size:12px}
.task-copy small{display:block;color:#8a9388;margin-top:3px;font-size:10px}
.tag{
  font-size:9px;letter-spacing:.3px;border-radius:5px;
  padding:4px 7px;background:#eef4eb;color:#64805f;white-space:nowrap;
}
.btn{
  border-radius:9px;padding:12px 18px;background:var(--green);color:white;
  font-size:12px;font-weight:650;display:inline-flex;justify-content:center;
  align-items:center;gap:10px;min-height:42px;text-decoration:none;
  transition:background .15s;
}
.btn:hover{background:#0d5b47}
.btn svg{width:15px;height:15px}
.btn.light{background:#eef4eb;color:var(--green)}
.btn.light:hover{background:#e1ede0}
.btn.line{background:#fff;border:1px solid #dce3db;color:var(--green)}
.btn.line:hover{background:#f7faf6}
.btn.small{padding:8px 11px;min-height:36px;font-size:11px}
.form-footer{
  border-top:1px solid var(--line);padding-top:20px;margin-top:23px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.fine{font-size:10px;color:#869080;max-width:230px}
.feature{background:#e1efdc;border:0;position:relative;overflow:hidden;padding:28px}
.feature h2{font-size:25px;line-height:1.23;max-width:235px;letter-spacing:-1px}
.feature p{font-size:12px;color:#61765b;margin-top:13px;max-width:230px}
.plant{height:100px;margin-top:12px;position:relative}
.leaf{
  position:absolute;width:65px;height:28px;border-radius:100% 0 100% 0;
  background:#a7c99b;transform:rotate(15deg);left:27px;top:30px;
}
.leaf.two{left:88px;top:24px;transform:rotate(-70deg);background:#7fa375}
.leaf.three{left:75px;top:51px;transform:rotate(-25deg);background:#bed2a6}
.stem{
  position:absolute;left:88px;top:43px;height:55px;width:2px;
  background:#608358;transform:rotate(-18deg);
}
.feature .feature-caption{font-size:10px;margin-top:0;opacity:.8}
.compact{margin-top:20px}
.checks{padding:0;margin:15px 0 0;list-style:none}
.checks li{font-size:11px;display:flex;gap:9px;margin:12px 0;color:#71816c}
.check{color:#358168;font-size:13px;font-weight:700}
.note{font-size:10px;color:#8a9485;margin-top:20px}
.footer{
  font-size:10px;color:#9aa293;margin-top:35px;
  display:flex;justify-content:space-between;gap:15px;
}
.summary-strip{display:flex;gap:28px;flex-wrap:wrap;margin:25px 0}
.summary-strip>div{min-width:130px}
.summary-strip strong{font-size:28px;letter-spacing:-1px;display:block;font-weight:600}
.summary-strip small{font-size:10px;color:#84917c}
.lesson{padding:21px 0;display:flex;gap:19px;border-bottom:1px solid var(--line)}
.lesson:last-child{border:0}
.lesson-num{font-size:25px;color:#bdcbbc;font-weight:350;min-width:35px}
.lesson-main{flex:1}
.lesson-main p{font-size:12px;color:#7b8872;margin:6px 0 11px;max-width:450px}
.lesson-meta{display:flex;gap:15px;align-items:center;font-size:10px;color:#829277}
.lesson-complete{color:var(--green);font-weight:600}
.empty{padding:45px 20px;text-align:center;color:#6a7e60}
.scenario-label{font-size:10px;letter-spacing:1px;color:#809077;margin-bottom:12px}
.scenario{background:#f1f5ed;border-radius:12px;padding:22px;margin-bottom:22px}
.scenario p{font-size:13px;color:#52644b}
.scenario small{display:block;margin-top:13px;color:#7b8c71;font-size:10px}
.rubric{margin-top:18px}
.rubric-item{
  display:flex;gap:10px;padding:11px 0;
  border-bottom:1px solid #edf1e8;font-size:11px;
}
.rubric-item:last-child{border:0}
.rubric-icon{font-size:15px;min-width:16px;color:#84a56f;font-weight:700}
.rubric-item strong{display:block;font-weight:600;font-size:12px}
.rubric-item p{font-size:10px;color:#829276;margin-top:2px}
.sample-output{
  font-size:12px;background:#f4f7ef;border-left:2px solid #b6cf9c;
  padding:17px;white-space:pre-wrap;margin-top:14px;border-radius:0 8px 8px 0;
}
.metric{
  font-size:48px;letter-spacing:-2px;font-weight:500;
  color:var(--green);line-height:1;
}
.metric.negative{color:#a86643}
.metric small{font-size:17px;letter-spacing:0}
.calculation{
  padding:23px 0;margin:20px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  font-size:11px;color:#7d8d71;
}
.quality{
  display:flex;align-items:flex-start;gap:9px;
  font-size:11px;color:#708264;margin:18px 0;cursor:pointer;
}
.quality input{width:16px;height:16px;margin-top:2px;accent-color:var(--green)}
.progress{height:6px;background:#edf2e7;border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:#9bbd82;border-radius:4px;transition:width .25s}
.team-table{border-collapse:collapse;width:100%;font-size:12px;margin-top:18px}
.team-table th{
  text-align:left;font-size:10px;font-weight:500;color:#86967c;
  padding:12px;border-bottom:1px solid var(--line);
}
.team-table td{padding:18px 12px;border-bottom:1px solid #edf1e7}
.inline-note{
  font-size:11px;background:#f2f6ec;padding:13px 16px;
  border-radius:9px;color:#7a8a6d;margin-bottom:25px;
}
.bar-chart{display:grid;gap:20px;margin:25px 0}
.bar-row{
  display:grid;grid-template-columns:100px 1fr 40px;
  gap:12px;align-items:center;font-size:11px;color:#798b6e;
}
.bar{height:12px;background:#ecf2e6;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:#a5c58c}
.top-info{display:flex;align-items:center;gap:8px}
.mobile-menu{display:none;background:none;padding:4px}
.modal-bg{
  position:fixed;inset:0;background:#10271977;display:grid;
  place-items:center;z-index:50;padding:20px;backdrop-filter:blur(3px);
}
.modal{
  background:white;padding:33px;border-radius:19px;
  width:min(600px,100%);max-height:90vh;overflow:auto;
  box-shadow:0 20px 100px #001a1433;
}
.modal h2{font-size:24px}
.modal p{font-size:13px;color:#6f7f66;margin-top:15px}
.modal ul{font-size:12px;color:#6f7f66;padding-left:19px}
.modal li{margin:9px 0}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:white;padding:12px 23px;font-size:12px;
  border-radius:10px;z-index:100;box-shadow:0 5px 25px #142a2222;
}
.page-back{
  background:none;color:var(--green);font-size:12px;
  display:flex;gap:8px;align-items:center;margin-bottom:20px;padding:0;
}
.wide-note{font-size:11px;color:#798a6f;margin-top:14px;line-height:1.7}
.pill{background:#f1f4ed;font-size:10px;padding:4px 8px;border-radius:4px;color:#7b8c70}
.money{font-size:52px;color:var(--green);line-height:1;margin:20px 0 5px;letter-spacing:-2px}
.money span{font-size:14px;letter-spacing:0;color:#75876a}
.lesson-read{font-size:14px;color:#566e4d;line-height:1.9;margin-top:20px}
.lesson-read h3{margin-top:24px;color:var(--ink)}
.lesson-read p{margin-top:10px}
.lesson-read pre{
  white-space:pre-wrap;background:#f2f6ec;padding:18px;
  font:12px/1.8 inherit;border-radius:10px;
}
.cta-row{display:flex;gap:12px;margin-top:23px;flex-wrap:wrap}
.badge-row{display:flex;gap:8px;align-items:center}
.saving-note{font-size:11px;color:#829075;margin:12px 0}
.estimator-box{
  margin-top:22px;padding:18px;background:#f6f9f4;
  border:1px solid #e2eadf;border-radius:12px;
}
.estimator-row{
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;margin-bottom:10px;
}
.estimator-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;
  padding-top:14px;border-top:1px solid #e2eadf;
}
.estimator-stat strong{display:block;font-size:18px;color:var(--green);letter-spacing:-.5px}
.estimator-stat span{font-size:10px;color:var(--muted)}
@media(min-width:1550px){
  .content{padding-top:50px}
  .panel{padding:32px}
  .feature h2{font-size:30px;max-width:280px}
  .feature p{max-width:280px}
  .plant{height:130px}
  .heading-row{margin-bottom:35px}
  h1{font-size:40px}
}
@media(max-width:1120px){
  .sidebar{width:210px;padding:28px 13px}
  .main{margin-left:210px;width:calc(100% - 210px)}
  .topbar{padding:0 26px}
  .content{padding:30px 26px}
  .grid{grid-template-columns:minmax(0,1.5fr) minmax(235px,1fr);gap:18px}
  .panel{padding:22px}
  h1{font-size:30px}
  .feature h2{font-size:24px}
  .tag{display:none}
  .path-step{margin-right:16px;padding-right:7px}
}
@media(max-width:840px){
  .sidebar{display:none}
  .sidebar.open{display:flex}
  .main{margin-left:0;width:100%}
  .topbar{height:70px}
  .mobile-menu{display:block}
  .top-info{gap:16px}
  .content{padding:25px 20px 35px}
  .grid{grid-template-columns:1fr}
  .aside-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .aside-grid .compact{margin-top:0}
  .feature h2{max-width:none}
  .feature p{max-width:none}
  .plant{display:none}
  .feature-caption{margin-top:20px!important}
  .heading-row{align-items:flex-start}
  .path-steps{margin:24px 0}
  .path-step{font-size:10px;gap:5px;margin-right:14px}
  .top-right{gap:10px}
  .quiet-btn span{display:none}
  .panel{padding:22px}
  .footer{flex-direction:column;gap:6px}
}
@media(max-width:520px){
  h1{font-size:28px}
  .subtitle{font-size:12px}
  .aside-grid{grid-template-columns:1fr}
  .fields,.estimator-grid{grid-template-columns:1fr}
  .path-step{margin-right:9px;font-size:9px;padding-right:0}
  .path-step span{width:18px;height:18px;font-size:9px}
  .demo-tag{font-size:8px;padding:4px 6px}
  .form-footer{align-items:flex-start;flex-direction:column}
  .form-footer .btn{width:100%}
  .lesson{gap:10px}
  .lesson-num{min-width:25px;font-size:20px}
  .lesson{flex-wrap:wrap}
  .lesson>.btn{margin-left:35px}
  .team-table th,.team-table td{padding:10px 6px;font-size:10px}
  .heading-row>.btn{padding:9px 12px;font-size:10px}
  .summary-strip{gap:20px}
  .summary-strip>div{min-width:100px}
  .topbar{padding:0 20px}
  .crumb{font-size:10px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <button class="brand" id="brand-btn" aria-label="Go to My work">
      <div class="brand-mark">p</div>PractiCore<small>AI</small>
    </button>
    <div class="workspace-label">YOUR WORKSPACE</div>
    <nav class="nav" aria-label="Main navigation">
      <button data-page="work" class="active"></button>
      <button data-page="learn"></button>
      <button data-page="practice"></button>
      <button data-page="impact"></button>
    </nav>
    <div class="side-bottom">
      <div class="demo-help">
        <strong>Small steps. Useful skills.</strong>
        A learning path built around the work you actually do.<br>
        <button class="text-button" style="margin-top:12px" id="guide-btn">About this prototype</button>
      </div>
      <div class="profile">
        <div class="avatar">DN</div>
        <div>
          <strong>Demo learner</strong>
          <span>Sample company workspace</span>
        </div>
      </div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="top-info">
        <button class="mobile-menu" aria-label="Open navigation" aria-expanded="false" id="menu-btn"></button>
        <div class="crumb">Workspace <span style="margin:0 9px">/</span> <b id="crumb">My work</b></div>
      </div>
      <div class="top-right">
        <span class="demo-tag">INTERACTIVE CONCEPT DEMO</span>
        <button class="quiet-btn" id="team-btn"></button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

const icons = {
  work: '<rect x="3" y="6" width="18" height="15" rx="2"/><path d="M8 6V3h8v3M3 12h18M10 12v3h4v-3"/>',
  learn: '<path d="M3 5c3-1 6 0 9 2 3-2 6-3 9-2v15c-3-1-6 0-9 2-3-2-6-3-9-2V5Z"/><path d="M12 7v15"/>',
  practice: '<path d="m9 3 6 0M10 3v7l-6 9c-.7 1 0 2 1 2h14c1 0 1.7-1 1-2l-6-9V3M7 16h10"/>',
  impact: '<path d="M4 20V12m8 8V4m8 16v-9M2 22h20"/>',
  arrow: '<path d="M4 12h16m-6-6 6 6-6 6"/>',
  team: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.87M16 3a4 4 0 0 1 0 8"/><circle cx="9" cy="7" r="4"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  back: '<path d="M20 12H4m6-6-6 6 6 6"/>',
  download: '<path d="M12 3v12m-5-5 5 5 5-5M4 15v6h16v-6"/>',
  shield: '<path d="m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6l9-4Z"/><path d="m8 12 3 3 5-6"/>'
};

const ic = n => '<svg viewBox="0 0 24 24" aria-hidden="true">' + icons[n] + '</svg>';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const roleData = {
  sales: {
    name: 'Sales & account management',
    short: 'Sales',
    tasks: [
      ['Draft follow-up emails', 'After client meetings · 4 times / week', 'Writing'],
      ['Prepare a client meeting brief', 'Before discovery calls · 3 times / week', 'Research'],

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem('practicore-demo-v1') || '{}');
    const merged = { ...defaults, ...raw };
    if (!roleData[merged.role]) merged.role = 'sales';
    if (!Array.isArray(merged.completed)) merged.completed = [];
    if (merged.tasks !== null && !Array.isArray(merged.tasks)) merged.tasks = null;
    merged.before = Number.isFinite(Number(merged.before)) ? Math.max(0, Math.min(600, Number(merged.before))) : defaults.before;
    merged.after = Number.isFinite(Number(merged.after)) ? Math.max(0, Math.min(600, Number(merged.after))) : defaults.after;
    merged.freq = Number.isFinite(Number(merged.freq)) ? Math.max(0, Math.min(100, Number(merged.freq))) : defaults.freq;
    merged.seats = Number.isFinite(Number(merged.seats)) ? Math.max(10, Math.min(40, Number(merged.seats))) : 25;
    return merged;
  } catch {
    return { ...defaults };
  }
}

function evaluatePromptRules(promptText) {
  const t = promptText.toLowerCase();
  return [
    ['Task and context', /draft|write|summari|checklist|brief|email|follow.up|convert|structure/.test(t), 'Name the task and the audience or context.'],
    ['Approved facts', /approved|saniti|sample|using only|these notes|facts|procedure/.test(t), 'Point to approved input rather than asking for invented details.'],
    ['Output format', /concise|short|checklist|format|include|bullet|summary|steps/.test(t), 'Explain the shape of a useful answer.'],
    ['Missing information', /missing|unknown|confirm|do not invent|don.t invent|flag/.test(t), 'Ask the assistant to flag gaps.'],
    ['Human review', /review|verify|check|approval|approve/.test(t), 'Keep a human review before the output enters real work.']
  ];
}

function buildRubricHtml(promptText) {
  const rules = evaluatePromptRules(promptText);
  return '<div class="rubric"><h3>Prompt elements to review</h3>' +
    rules.map(([n, ok, help]) =>
      '<div class="rubric-item">' +
        '<span class="rubric-icon">' + (ok ? '✓' : '○') + '</span>' +
        '<div><strong>' + n + '</strong><p>' + (ok ? 'Element detected. Confirm that it fits your task.' : help) + '</p></div>' +
      '</div>'
    ).join('') +
  '</div>';
}

        '<p class="note">' + (state.saved ? 'You have saved the sample workflow.' : 'Save a workflow in the practice lab to complete the journey.') + '</p>' +
      '</section>' +
    '</aside>' +
  '</div>';
}

  '<div class="inline-note">Fictional cohort data for demonstration (illustrative 20-learner SME cohort). Individual prompts and employee rankings do not appear in this view.</div>' +
  '<section class="panel">' +
    '<div class="panel-head"><h2>Sample cohort overview</h2><span class="pill">20 assigned learners</span></div>' +
    '<div class="summary-strip">' +

      '<div><strong>8</strong><small>Reviewed sample workflows</small></div>' +

    '</div>' +

      '<thead><tr><th>Role group</th><th>Assigned</th><th>Started</th><th>Reviewed workflows</th></tr></thead>' +
      '<tbody>' +
        '<tr><td>Sales</td><td>8</td><td>5</td><td>3</td></tr>' +
        '<tr><td>Marketing</td><td>6</td><td>4</td><td>3</td></tr>' +

  '</section>' +
  '<div class="grid" style="margin-top:25px">' +
    '<section class="panel">' +
      '<h2>Workflow adoption by role</h2>' +
      '<div class="bar-chart">' +
        [['Sales', 38], ['Marketing', 50], ['Operations', 33]].map(([n, v]) =>
          '<div class="bar-row"><span>' + n + '</span><div class="bar"><i style="width:' + v + '%"></i></div><span>' + v + '%</span></div>'
        ).join('') +

      '<p class="eyebrow">A PRACTICAL START FOR SMALLER TEAMS</p>' +
      '<h2>One role. A small cohort. A result to verify.</h2>' +
      '<p>Start with a focused pilot (10–40 learners in an SME team) before expanding to more workflows or departments.</p>' +
      '<button class="btn light" data-nav="plan" style="margin-top:20px">View proposed plan ' + ic('arrow') + '</button>' +
    '</section>' +

}

function planView() {
  return heading(
    'PROPOSED BUSINESS MODEL',
    'A focused plan for a first cohort.',
    'Illustrative pricing assumptions aligned with the business plan (Romanian business-services SMEs, 20–249 employees). No purchase takes place here.'
  ) +
  '<div class="grid">' +
    '<section class="panel">' +
      '<div class="panel-head"><h2>PractiCore Team</h2><span class="pill">Base planning hypothesis</span></div>' +
      '<div class="money">€19 <span>/ paid seat / month</span></div>' +
      '<p class="small-label">Minimum 10 seats · €300 one-time employer onboarding fee</p>' +
      '<ul class="checks">' +
        '<li><span class="check">✓</span>Task mapping and role-specific learning paths</li>' +
        '<li><span class="check">✓</span>Text-based practice with sample work scenarios (20 sessions / seat / mo)</li>' +
        '<li><span class="check">✓</span>Reviewed workflow templates and an impact journal</li>' +
        '<li><span class="check">✓</span>Aggregate employer progress view (no employee ranking)</li>' +
      '</ul>' +
      '<div class="estimator-box">' +
        '<div class="estimator-row">' +
          '<label for="seat-slider" style="font-weight:600;color:var(--ink)">Illustrative cohort size (base case: 25 seats)</label>' +
          '<span class="pill" id="seat-count-label">' + state.seats + ' paid seats</span>' +
        '</div>' +
        '<input type="range" id="seat-slider" min="10" max="40" step="1" value="' + state.seats + '">' +
        '<div class="estimator-grid">' +
          '<div class="estimator-stat"><strong id="mrr-est">€' + (state.seats * 19) + ' / mo</strong><span>Monthly recurring subscription</span></div>' +
          '<div class="estimator-stat"><strong id="pilot-est">€' + Math.round(state.seats * 19 * 1.5 + 300) + '</strong><span>6-week pilot total (incl. €300 setup)</span></div>' +
        '</div>' +
      '</div>' +
      '<p class="wide-note">Company AI-tool subscriptions remain separate. Prices exclude VAT and represent planning assumptions requiring buyer validation.</p>' +
      '<div class="cta-row"><button class="btn" data-nav="work">Explore the demo ' + ic('arrow') + '</button></div>' +
    '</section>' +
    '<section class="panel feature">' +
      '<p class="eyebrow">VALIDATION BEFORE SCALE</p>' +
      '<h2>The next milestone is a real pilot.</h2>' +

      '<p class="feature-caption" style="margin-top:22px">Targets only · No design partner committed yet</p>' +

  '</div>';
}

function updateImpact() {
  const a = Number(state.before);
  const b = Number(state.after);
  const f = Number(state.freq);
  const minutes = (a - b) * f;
  const metricEl = document.getElementById('weekly-metric');
  metricEl.classList.toggle('negative', minutes < 0);
  metricEl.innerHTML = (minutes / 60).toFixed(1) + ' <small>hours / week</small>';
  document.getElementById('weekly-description').textContent = minutes >= 0
    ? 'Potential capacity released for this sample task.'
    : 'The sample task takes longer with AI at these inputs.';
  document.getElementById('calculation').textContent =
    '(' + a + ' min − ' + b + ' min) × ' + f + ' times / week = ' + minutes + ' minutes / week. Quality review: ' +
    (state.quality ? 'checked for the sample.' : 'still to confirm.');
}

function bindPage() {
  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => nav(b.dataset.nav));
  document.querySelectorAll('[data-lesson]').forEach(b => b.onclick = () => {
    currentLesson = Number(b.dataset.lesson);
    nav('lesson');
  });

  if (page === 'work') {
    document.getElementById('role-select').onchange = e => {
      const nextRole = e.target.value;
      state = {
        ...state,
        role: nextRole,
        tasks: null,
        path: false,
        completed: [],
        practice: false,
        saved: false,
        prompt: '',
        custom: '',
        quality: false,
        before: roleData[nextRole].baseline,
        after: roleData[nextRole].after,
        freq: roleData[nextRole].freq
      };
      save();
      render();
    };
    document.getElementById('level-select').onchange = e => { state.level = e.target.value; save(); };
    document.getElementById('tool-select').onchange = e => { state.tool = e.target.value; save(); };
    document.getElementById('custom-task').oninput = e => { state.custom = e.target.value; save(); };
    document.querySelectorAll('[name=task]').forEach(b => b.onchange = () => {
      state.tasks = [...document.querySelectorAll('[name=task]:checked')].map(c => c.value);
      save();
    });
    document.getElementById('build-path').onclick = () => {
      if (!taskList().length && !state.custom.trim()) {
        toast('Select at least one task or add a sample task.');
        return;
      }
      state.path = true;
      save();
      nav('learn');
    };
  }

  if (page === 'lesson') {
    document.getElementById('complete-lesson').onclick = () => {
      if (!state.completed.includes(currentLesson)) state.completed.push(currentLesson);
      save();
      toast('Lesson marked complete.');
      nav('learn');
    };
    const nextBtn = document.getElementById('next-lesson');
    if (nextBtn) {
      nextBtn.onclick = () => {
        if (!state.completed.includes(currentLesson)) state.completed.push(currentLesson);
        save();
        currentLesson += 1;
        render();
        window.scrollTo(0, 0);
      };
    }
  }

  if (page === 'practice') {
    document.getElementById('prompt-input').oninput = e => {
      state.prompt = e.target.value;
      save();
    };
    document.getElementById('use-example').onclick = () => {
      state.prompt = roleData[state.role].prompt;
      save();
      document.getElementById('prompt-input').value = state.prompt;
      toast('Guided example added. Review it before continuing.');
    };
    document.getElementById('review-prompt').onclick = reviewPrompt;
    bindPracticeResult();
  }

  if (page === 'impact') {
    ['before', 'after', 'freq'].forEach(k => {
      document.getElementById(k + '-input').oninput = e => {
        const max = k === 'freq' ? 100 : 600;
        state[k] = Math.max(0, Math.min(max, Number(e.target.value) || 0));
        save();
        updateImpact();
      };
    });
    document.getElementById('quality-check').onchange = e => {
      state.quality = e.target.checked;
      save();
      updateImpact();
    };
    document.getElementById('export-workflow').onclick = exportWorkflow;
    updateImpact();
  }

  if (page === 'plan') {
    const slider = document.getElementById('seat-slider');
    if (slider) {
      slider.oninput = e => {
        state.seats = Number(e.target.value);
        save();
        document.getElementById('seat-count-label').textContent = state.seats + ' paid seats';
        document.getElementById('mrr-est').textContent = '€' + (state.seats * 19) + ' / mo';
        document.getElementById('pilot-est').textContent = '€' + Math.round(state.seats * 19 * 1.5 + 300);
      };
    }
  }
}

function bindPracticeResult() {
  const b = document.getElementById('save-workflow');
  if (b) {
    b.onclick = () => {
      state.saved = true;
      save();
      b.textContent = '✓ Workflow saved';
      toast('Sample workflow saved in this browser.');
    };
  }
  document.querySelectorAll('#practice-result [data-nav]').forEach(btn => {
    btn.onclick = () => nav(btn.dataset.nav);
  });
}

function reviewPrompt() {
  if (state.prompt.trim().length < 20) {
    toast('Add a prompt, or use the guided example.');
    return;
  }
  state.practice = true;
  save();
  document.getElementById('practice-result').innerHTML = buildRubricHtml(state.prompt) + sampleResult();
  bindPracticeResult();
  toast('Prompt reviewed against the demo checklist.');
}

function exportWorkflow() {
  const r = roleData[state.role];
  const tasksCombined = [...taskList(), ...(state.custom.trim() ? [state.custom.trim()] : [])].join('; ');
  const txt =
    'PRACTICORE AI — SAMPLE WORKFLOW

' +
    'Role: ' + r.name + '
' +
    'Tasks: ' + tasksCombined + '
' +
    'Approved tool: ' + state.tool + '

' +
    'PROMPT
' + (state.prompt.trim() || r.prompt) + '

' +
    'REVIEW CHECKLIST
' +
    '1. Verify facts against approved input.
' +
    '2. Flag unknown details.
' +
    '3. Remove restricted data.
' +
    '4. Obtain human approval before use.

' +
    'ILLUSTRATIVE IMPACT INPUTS
' +
    'Before: ' + state.before + ' min. With AI including review: ' + state.after + ' min. Frequency: ' + state.freq + ' / week.
' +
    'Potential weekly capacity: ' + ((state.before - state.after) * state.freq) + ' minutes.
' +
    'Quality check: ' + (state.quality ? 'checked on sample' : 'not yet confirmed') + '.

' +
    'This is a student concept prototype with sample content, not a live AI assessment or measured customer result.';

  const a = document.createElement('a');
  const url = URL.createObjectURL(new Blob([txt], { type: 'text/plain;charset=utf-8' }));
  a.href = url;
  a.download = 'PractiCore_Sample_Workflow.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Sample workflow downloaded.');
}

function modal() {
  document.getElementById('overlay').innerHTML =
    '<div class="modal-bg" id="modal-bg">' +
      '<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
        '<p class="eyebrow">POLINNOVENTURE 2026</p>' +
        '<h2 id="modal-title">About this prototype</h2>' +
        '<p>PractiCore AI is a proposed platform that helps employees apply AI to their everyday work. This interactive demonstration was prepared by Popa Alexandru Daniel and Turcu Nicholas-Leonard.</p>' +
        '<ul>' +
          '<li>Choose a role, map sample tasks and explore a learning path.</li>' +
          '<li>Read lessons, write a prompt and receive rule-based checklist feedback.</li>' +
          '<li>Save a sample workflow and edit an illustrative impact calculation.</li>' +
          '<li>Explore a fictional aggregate employer dashboard and cohort pricing estimator.</li>' +
        '</ul>' +
        '<p>The demo uses predefined role templates, prewritten outputs and local browser storage. It does not call an AI model, upload data or measure employee performance. Custom task text appears in your priorities and workflow export, while lesson content follows the selected role.</p>' +
        '<p>Use fictional information. The proposed €19 price, 25-seat base cohort, employer figures and time estimates are planning assumptions requiring validation.</p>' +
        '<div class="modal-footer">' +
          '<button class="btn line" id="reset-btn">Reset demo</button>' +
          '<button class="btn" id="close-modal">Continue exploring</button>' +
        '</div>' +
      '</section>' +
    '</div>';

  document.getElementById('close-modal').onclick = closeModal;
  document.getElementById('reset-btn').onclick = () => {
    state = { ...defaults };
    save();
    closeModal();
    nav('work');
    toast('Demo progress reset.');
  };
  document.getElementById('modal-bg').onclick = e => {
    if (e.target.id === 'modal-bg') closeModal();
  };
  document.getElementById('close-modal').focus();
}

function closeModal() {
  const overlay = document.getElementById('overlay');
  if (!overlay.innerHTML) return;
  overlay.innerHTML = '';
  document.getElementById('guide-btn').focus();
}

document.querySelectorAll('[data-page]').forEach(b => b.onclick = () => nav(b.dataset.page));
document.getElementById('brand-btn').onclick = () => nav('work');
document.getElementById('team-btn').onclick = () => nav('team');
document.getElementById('guide-btn').onclick = modal;
document.getElementById('menu-btn').onclick = () => {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebar-backdrop');
  const isOpen = sb.classList.toggle('open');
  bd.classList.toggle('open', isOpen);
  document.getElementById('menu-btn').setAttribute('aria-expanded', String(isOpen));
};
document.getElementById('sidebar-backdrop').onclick = closeSidebar;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal();
    closeSidebar();
  }
});

render();
</script>
</body>
</html>
